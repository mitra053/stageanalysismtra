<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Stage Analysis Tools - TradingView Chart</title>
  
  <!-- Modern Typography & Tailwind CSS -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- TradingView Charting Library -->
  <script type="text/javascript" src="charting_library/charting_library.standalone.js"></script>
  <script type="text/javascript" src="datafeeds/udf/dist/bundle.js"></script>

  <!-- Custom Stage Analysis Indicators -->
  <script type="text/javascript" src="mansfield_rs.js"></script>
  <script type="text/javascript" src="stage_classifier.js"></script>
  <script type="text/javascript" src="sata_score.js"></script>
  <script type="text/javascript" src="sidepanel.js"></script>

  <style>
    :root {
      --page-bg: #050b16;
      --page-bg-2: #07111d;
      --surface: #0f172a;
      --surface-2: #111827;
      --surface-soft: #0b1220;
      --text: #e2e8f0;
      --text-soft: #94a3b8;
      --text-strong: #f8fafc;
      --line: rgba(148, 163, 184, 0.2);
      --panel-shadow: rgba(2, 6, 23, 0.35);
    }

    body {
      font-family: 'Inter', sans-serif;
      background:
        radial-gradient(circle at top left, rgba(99,102,241,0.18), transparent 22%),
        radial-gradient(circle at bottom right, rgba(34,211,238,0.08), transparent 30%),
        var(--page-bg);
      margin: 0;
      padding: 0;
      overflow: hidden;
      color: var(--text);
      transition: background 0.2s ease, color 0.2s ease;
    }

    body[data-theme="light"] {
      --page-bg: #f8fafc;
      --page-bg-2: #eef2ff;
      --surface: #ffffff;
      --surface-2: #f8fafc;
      --surface-soft: #f8fafc;
      --text: #0f172a;
      --text-soft: #475569;
      --text-strong: #0f172a;
      --line: rgba(148, 163, 184, 0.38);
      --panel-shadow: rgba(15, 23, 42, 0.08);
    }

    #chart_wrapper {
      height: calc(100vh - 165px);
      min-height: 500px;
      background: linear-gradient(180deg, var(--page-bg-2) 0%, var(--page-bg) 100%);
    }
    #tv_chart_container {
      height: 100%;
      width: 100%;
      background: var(--page-bg);
      box-shadow: inset 0 0 50px rgba(15, 23, 42, 0.9);
    }
    .terminal-shell {
      background: rgba(15, 23, 42, 0.88);
      border: 1px solid var(--line);
      box-shadow: 0 12px 24px var(--panel-shadow), 0 0 0 1px rgba(99, 102, 241, 0.09);
    }
    .panel-glow {
      box-shadow: 0 0 0 1px rgba(99, 102, 241, 0.14), 0 12px 26px var(--panel-shadow);
    }

    body[data-theme="light"] .bg-slate-900,
    body[data-theme="light"] .bg-slate-950,
    body[data-theme="light"] .bg-slate-800,
    body[data-theme="light"] .bg-slate-900\/80,
    body[data-theme="light"] .bg-slate-900\/95,
    body[data-theme="light"] .bg-slate-100,
    body[data-theme="light"] .bg-slate-50 {
      background-color: var(--surface) !important;
      border-color: var(--line) !important;
    }

    body[data-theme="light"] header,
    body[data-theme="light"] nav,
    body[data-theme="light"] section,
    body[data-theme="light"] aside,
    body[data-theme="light"] .terminal-shell,
    body[data-theme="light"] .panel-glow {
      background-color: var(--surface) !important;
      border-color: var(--line) !important;
      color: var(--text) !important;
    }

    body[data-theme="light"] .text-slate-100,
    body[data-theme="light"] .text-slate-200,
    body[data-theme="light"] .text-slate-300,
    body[data-theme="light"] .text-slate-400,
    body[data-theme="light"] .text-slate-500,
    body[data-theme="light"] .text-slate-600,
    body[data-theme="light"] .text-slate-700,
    body[data-theme="light"] .text-slate-800,
    body[data-theme="light"] .text-slate-900 {
      color: var(--text) !important;
    }

    body[data-theme="light"] .text-slate-300,
    body[data-theme="light"] .text-slate-400,
    body[data-theme="light"] .text-slate-500 {
      color: var(--text-soft) !important;
    }

    body[data-theme="light"] .border-slate-700,
    body[data-theme="light"] .border-slate-800,
    body[data-theme="light"] .border-slate-200,
    body[data-theme="light"] .border-slate-300,
    body[data-theme="light"] .border-slate-100 {
      border-color: var(--line) !important;
    }

    body[data-theme="light"] .bg-indigo-600,
    body[data-theme="light"] .bg-gradient-to-r.from-indigo-600.to-violet-600 {
      background: linear-gradient(90deg, #4f46e5 0%, #7c3aed 100%) !important;
    }

    body[data-theme="aurora"] {
      --page-bg: #061521;
      --page-bg-2: #0b1d2d;
      --surface: #0d2238;
      --surface-2: #102743;
      --surface-soft: #0d1a2a;
      --text: #ebf4ff;
      --text-soft: #a9bfd8;
      --text-strong: #ffffff;
      --line: rgba(146, 197, 255, 0.24);
      --panel-shadow: rgba(14, 116, 144, 0.18);
    }

    body[data-theme="aurora"] .bg-slate-950,
    body[data-theme="aurora"] .bg-slate-900,
    body[data-theme="aurora"] .bg-slate-800,
    body[data-theme="aurora"] .bg-slate-900\/80,
    body[data-theme="aurora"] .bg-slate-800\/80 {
      background-color: rgba(13, 34, 56, 0.88) !important;
      border-color: var(--line) !important;
    }

    body:not([data-theme="light"]) .text-slate-900,
    body:not([data-theme="light"]) .text-slate-800,
    body:not([data-theme="light"]) .text-slate-700 {
      color: var(--text-strong) !important;
    }

    body:not([data-theme="light"]) .text-slate-500,
    body:not([data-theme="light"]) .text-slate-400,
    body:not([data-theme="light"]) .text-slate-300 {
      color: var(--text-soft) !important;
    }
  </style>
</head>

<body class="flex flex-col h-screen text-slate-800">

  <!-- Top Navigation Header -->
  <header class="bg-slate-950/95 text-white px-6 py-3.5 border-b border-indigo-500/20 shadow-[0_0_25px_rgba(99,102,241,0.12)]">
    <div class="flex items-center justify-between gap-4">
      <div class="flex items-center space-x-3">
        <div class="bg-gradient-to-br from-indigo-500 to-violet-600 p-2 rounded-xl font-bold text-lg tracking-wider flex items-center justify-center shadow-lg shadow-indigo-500/30">
          SA
        </div>
        <div>
          <h1 class="font-bold text-lg leading-none">Stage Analysis</h1>
          <p class="text-xs text-slate-400">Stan Weinstein's Four Stage Technical Method</p>
        </div>
      </div>

      <nav class="hidden lg:flex items-center gap-2 bg-slate-900/70 border border-slate-700/80 rounded-xl p-1 backdrop-blur-sm">
        <a href="dashboard.html" class="px-3 py-1.5 text-xs font-semibold rounded-lg text-slate-200 hover:bg-slate-700 transition">Dashboard</a>
        <a href="index.html" class="px-3 py-1.5 text-xs font-semibold rounded-lg bg-indigo-600 text-white shadow-sm shadow-indigo-500/25">Chart</a>
        <a href="dashboard.html#watchlist" class="px-3 py-1.5 text-xs font-semibold rounded-lg text-slate-200 hover:bg-slate-700 transition">Watchlist</a>
        <a href="dashboard.html#scan" class="px-3 py-1.5 text-xs font-semibold rounded-lg text-slate-200 hover:bg-slate-700 transition">Scan</a>
        <a href="dashboard.html#risk" class="px-3 py-1.5 text-xs font-semibold rounded-lg text-slate-200 hover:bg-slate-700 transition">Risk</a>
      </nav>

      <div class="flex items-center gap-3">
        <div class="hidden md:flex items-center space-x-2">
          <span class="text-xs text-slate-400 uppercase font-semibold mr-1">Watchlist:</span>
          <button data-symbol="AAPL" class="px-2.5 py-1 text-xs font-semibold rounded bg-slate-800/90 hover:bg-slate-700 text-slate-200 transition border border-slate-700">AAPL</button>
          <button data-symbol="MSFT" class="px-2.5 py-1 text-xs font-semibold rounded bg-slate-800/90 hover:bg-slate-700 text-slate-200 transition border border-slate-700">MSFT</button>
          <button data-symbol="NVDA" class="px-2.5 py-1 text-xs font-semibold rounded bg-slate-800/90 hover:bg-slate-700 text-slate-200 transition border border-slate-700">NVDA</button>
          <button data-symbol="SPY" class="px-2.5 py-1 text-xs font-semibold rounded bg-slate-800/90 hover:bg-slate-700 text-slate-200 transition border border-slate-700">SPY</button>
          <button data-symbol="QQQ" class="px-2.5 py-1 text-xs font-semibold rounded bg-slate-800/90 hover:bg-slate-700 text-slate-200 transition border border-slate-700">QQQ</button>
        </div>

        <button onclick="document.getElementById('stockSearchModal').style.display='flex'"
                class="flex items-center space-x-2 bg-gradient-to-r from-indigo-600 to-violet-600 hover:brightness-110 text-white px-3.5 py-1.5 rounded-xl text-sm font-medium transition shadow-lg shadow-indigo-500/20">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
          </svg>
          <span>Search Stock</span>
        </button>
      </div>
    </div>
  </header>

  <!-- Stage Analysis Header Summary Bar -->
  <section class="bg-slate-950/80 border-b border-indigo-500/20 px-6 py-3 shadow-[0_12px_25px_rgba(2,6,23,0.22)]">
    <div class="max-w-7xl mx-auto flex flex-col md:flex-row md:items-center justify-between gap-4">
      <div class="flex items-center space-x-4">
        <div>
          <span class="text-xs text-slate-500 uppercase tracking-wider font-semibold">Active Ticker</span>
          <h2 id="currentSymbolDisplay" class="text-2xl font-bold text-slate-900 leading-none">AAPL</h2>
        </div>
        <div class="h-8 w-px bg-slate-200"></div>
        <div>
          <div class="flex items-center space-x-2">
            <span class="text-xs text-slate-500 uppercase tracking-wider font-semibold">SATA Score</span>
            <span id="sataScoreStatus" class="px-2.5 py-0.5 text-xs font-bold rounded uppercase tracking-wider bg-emerald-600 text-white">Strong</span>
          </div>
          <p id="sataScoreValue" class="text-xl font-bold text-slate-800 leading-tight">7 / 10</p>
        </div>
      </div>

      <div class="text-xs text-slate-300 max-w-lg bg-slate-900/80 p-2.5 rounded-xl border border-slate-700 shadow-inner">
        <span id="sataScoreDescription">SATA score evaluates 10 technical criteria (Moving Averages, Relative Strength, Volume & Breakouts).</span>
      </div>
    </div>
  </section>

  <!-- Interactive Controls Toolbar -->
  <section class="bg-slate-900/80 border-b border-slate-700 px-6 py-2 flex flex-wrap items-center justify-between text-xs gap-3 shadow-[inset_0_1px_0_rgba(148,163,184,0.1)]">
    <!-- Interval Selector -->
    <div class="flex items-center space-x-2">
      <label for="chartIntervalSelect" class="font-semibold text-slate-700">Interval:</label>
      <select id="chartIntervalSelect" class="bg-white border border-slate-300 rounded px-2.5 py-1 text-slate-800 font-medium focus:outline-none focus:ring-2 focus:ring-indigo-500">
        <option value="1W" selected>Weekly (Weinstein Standard)</option>
        <option value="1D">Daily</option>
        <option value="1M">Monthly</option>
      </select>
    </div>

    <!-- Custom Studies & Sidepanel Toggles -->
    <div class="flex items-center space-x-4">
      <label class="flex items-center space-x-1.5 cursor-pointer font-medium text-slate-300">
        <input type="checkbox" id="stageOverlayCheckbox" checked class="rounded text-indigo-600 focus:ring-indigo-500 h-4 w-4">
        <span>30W Stage Overlay</span>
      </label>

      <label class="flex items-center space-x-1.5 cursor-pointer font-medium text-slate-300">
        <input type="checkbox" id="mansfieldRsCheckbox" checked class="rounded text-indigo-600 focus:ring-indigo-500 h-4 w-4">
        <span>Mansfield RS</span>
      </label>

      <label class="flex items-center space-x-1.5 cursor-pointer font-medium text-slate-300">
        <input type="checkbox" id="sataScoreCheckbox" checked class="rounded text-indigo-600 focus:ring-indigo-500 h-4 w-4">
        <span>SATA Score Plot</span>
      </label>

      <div class="h-4 w-px bg-slate-300"></div>

      <button id="themeToggleBtn" class="flex items-center gap-2 bg-slate-800/80 border border-slate-700 hover:bg-slate-700 text-slate-100 px-3 py-1.5 rounded-lg text-xs font-medium transition shadow-sm">
        <span>🌙</span>
        <span>Dark</span>
      </button>

      <!-- Sidepanel Toggle Button -->
      <button id="toggleSidepanelBtn" class="flex items-center space-x-1.5 bg-gradient-to-r from-indigo-600 to-violet-600 hover:brightness-110 text-white px-3 py-1 rounded-lg text-xs font-semibold transition shadow-lg shadow-indigo-500/20">
        <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h7"></path>
        </svg>
        <span>Sidepanel Details</span>
      </button>
    </div>
  </section>

  <!-- Main TradingView Chart & Sidepanel Area -->
  <main id="chart_wrapper" class="flex-1 bg-slate-900 flex overflow-hidden relative">
    <div id="tv_chart_container" class="flex-1 h-full"></div>

    <!-- Stage Analysis Breakdown Sidepanel -->
    <aside id="stageSidepanel" class="w-80 md:w-96 border-l border-slate-800 bg-slate-900 text-slate-100 flex flex-col overflow-y-auto shrink-0 shadow-2xl z-10 transition-all duration-300">
      <div id="sidepanelContent">
        <!-- Populated dynamically by sidepanel.js -->
      </div>
    </aside>
  </main>

  <!-- Ticker Search Modal -->
  <div id="stockSearchModal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-xs flex items-center justify-center z-50 p-4" style="display: none;">
    <div class="bg-white rounded-xl shadow-2xl max-w-md w-full p-6 border border-slate-100">
      <div class="flex items-center justify-between border-b border-slate-100 pb-3 mb-4">
        <h3 class="text-lg font-bold text-slate-900">Search Stock / ETF</h3>
        <button onclick="document.getElementById('stockSearchModal').style.display='none'" class="text-slate-400 hover:text-slate-600 text-xl font-bold">&times;</button>
      </div>

      <form id="nav-stock-search-form" class="space-y-4">
        <div>
          <label for="nav-stock-search-input" class="block text-xs font-semibold text-slate-600 uppercase mb-1">Enter Ticker Symbol</label>
          <input type="text" id="nav-stock-search-input" placeholder="e.g. AAPL, TSLA, NVDA, SPY"
                 class="w-full border border-slate-300 rounded-lg px-3.5 py-2.5 text-slate-900 font-semibold focus:outline-none focus:ring-2 focus:ring-indigo-500 uppercase">
        </div>
        <div class="flex justify-end space-x-2 pt-2">
          <button type="button" onclick="document.getElementById('stockSearchModal').style.display='none'"
                  class="px-4 py-2 text-sm font-medium text-slate-600 hover:bg-slate-100 rounded-lg transition">Cancel</button>
          <button type="submit"
                  class="px-4 py-2 text-sm font-semibold bg-indigo-600 hover:bg-indigo-500 text-white rounded-lg transition shadow-sm">Load Chart</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Stage Analysis Application Controller -->
  <button id="themeToggleBtn" class="flex items-center gap-2 bg-slate-800/80 border border-slate-700 hover:bg-slate-700 text-slate-100 px-3 py-1.5 rounded-lg text-xs font-medium transition shadow-sm">
    <span>🌙</span>
    <span>Dark</span>
  </button>

  <script type="text/javascript" src="theme.js"></script>
  <script type="text/javascript" src="stage_analysis_app.js"></script>
</body>

</html>
