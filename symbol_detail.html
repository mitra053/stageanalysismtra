<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Symbol Detail</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      :root {
        --page-bg: #020817;
        --page-bg-2: #0f172a;
        --panel: rgba(15,23,42,0.96);
        --panel-soft: rgba(15,23,42,0.9);
        --text: #e2e8f0;
        --text-soft: #94a3b8;
        --line: rgba(148,163,184,0.18);
      }

      body {
        font-family: 'Inter', sans-serif;
        background:
          radial-gradient(circle at top left, rgba(99,102,241,0.16), transparent 26%),
          radial-gradient(circle at bottom right, rgba(14,165,233,0.08), transparent 30%),
          linear-gradient(180deg, var(--page-bg) 0%, var(--page-bg-2) 35%, #111827 100%);
        color: var(--text);
        transition: background 0.2s ease, color 0.2s ease;
      }

      body[data-theme="light"] {
        --page-bg: #f8fafc;
        --page-bg-2: #eef2ff;
        --panel: rgba(255,255,255,0.96);
        --panel-soft: rgba(248,250,252,0.96);
        --text: #0f172a;
        --text-soft: #475569;
        --line: rgba(148,163,184,0.32);
      }

      .glass-card {
        background: linear-gradient(180deg, var(--panel), var(--panel-soft));
        backdrop-filter: blur(8px);
        box-shadow: 0 14px 30px rgba(2, 6, 23, 0.38), 0 0 0 1px rgba(99, 102, 241, 0.07);
        border: 1px solid var(--line);
        color: var(--text);
      }
      .glass-card *, .glass-card h1, .glass-card h2, .glass-card h3, .glass-card p, .glass-card span, .glass-card strong {
        color: inherit;
      }
      .premium-btn {
        box-shadow: 0 12px 24px rgba(79, 70, 229, 0.28);
      }
      .glass-card .bg-slate-50 {
        background: rgba(15, 23, 42, 0.7) !important;
        border-color: rgba(148, 163, 184, 0.16) !important;
      }
      body[data-theme="light"] .glass-card .bg-slate-50,
      body[data-theme="light"] .bg-slate-50 {
        background: #f8fafc !important;
        border-color: rgba(148,163,184,0.32) !important;
      }
      .glass-card .text-slate-500,
      .glass-card .text-slate-700,
      .glass-card .text-slate-900 {
        color: #cbd5e1 !important;
      }
      body[data-theme="light"] .glass-card .text-slate-500,
      body[data-theme="light"] .glass-card .text-slate-700,
      body[data-theme="light"] .glass-card .text-slate-900 {
        color: #0f172a !important;
      }

      body[data-theme="aurora"] {
        --page-bg: #061521;
        --page-bg-2: #0b1d2d;
        --panel: rgba(13, 34, 56, 0.96);
        --panel-soft: rgba(16, 39, 67, 0.92);
        --text: #ebf4ff;
        --text-soft: #a9bfd8;
        --line: rgba(146, 197, 255, 0.24);
      }

      body[data-theme="light"] header,
      body[data-theme="light"] nav,
      body[data-theme="light"] .glass-card {
        color: var(--text) !important;
      }
    </style>
  </head>
  <body class="bg-slate-100 text-slate-800">
    <header class="bg-slate-900 text-white shadow-md border-b border-slate-800">
      <div class="max-w-7xl mx-auto px-6 py-3.5 flex items-center justify-between gap-4">
        <div class="flex items-center gap-3">
          <div class="bg-gradient-to-br from-indigo-500 to-violet-600 p-2 rounded-xl font-bold text-lg tracking-wider flex items-center justify-center shadow-lg shadow-indigo-500/30">SA</div>
          <div>
            <h1 class="font-bold text-lg leading-none">Stage Analysis</h1>
            <p class="text-xs text-slate-400">Symbol detail</p>
          </div>
        </div>

        <nav class="hidden lg:flex items-center gap-2 bg-slate-800/80 border border-slate-700 rounded-xl p-1">
          <a href="dashboard.html" class="px-3 py-1.5 text-xs font-semibold rounded-lg bg-indigo-600 text-white shadow-sm">Dashboard</a>
          <a href="index.html" class="px-3 py-1.5 text-xs font-semibold rounded-lg text-slate-200 hover:bg-slate-700 transition">Chart</a>
        </nav>

        <div class="flex items-center gap-3">
          <button id="themeToggleBtn" class="flex items-center gap-2 bg-slate-800/80 border border-slate-700 hover:bg-slate-700 text-slate-100 px-3 py-1.5 rounded-lg text-xs font-medium transition shadow-sm">
            <span>🌙</span>
            <span>Dark</span>
          </button>
          <a href="dashboard.html" class="premium-btn bg-slate-700 hover:bg-slate-600 text-white px-4 py-2 rounded-xl text-sm font-medium transition shadow-sm">
            Back to Dashboard
          </a>
        </div>
      </div>
    </header>

    <main class="max-w-7xl mx-auto p-6 space-y-6">
      <section class="glass-card rounded-2xl border border-slate-200 shadow-sm p-5">
        <div class="flex flex-col md:flex-row md:items-center md:justify-between gap-4">
          <div>
            <p class="text-xs uppercase font-semibold tracking-wide text-slate-500">Selected symbol</p>
            <h2 id="symbolTitle" class="mt-2 text-4xl font-bold text-slate-900">--</h2>
          </div>
          <div class="flex items-center gap-3">
            <span id="stockActionBadge" class="rounded-full bg-emerald-100 text-emerald-700 px-3 py-1.5 text-xs font-bold">--</span>
            <a href="dashboard.html" class="premium-btn bg-indigo-600 hover:bg-indigo-500 text-white px-4 py-2 rounded-xl text-sm font-medium">Open scanner</a>
          </div>
        </div>

        <div class="mt-6 grid grid-cols-1 xl:grid-cols-[1.4fr_0.6fr] gap-6">
          <div class="rounded-2xl bg-slate-900 p-4 shadow-inner">
            <div class="mb-3 flex items-center justify-between text-xs uppercase tracking-wide text-slate-300">
              <span>Price trend</span>
              <span id="chartRangeLabel">1Y</span>
            </div>
            <svg id="priceChart" viewBox="0 0 860 260" class="w-full h-64 rounded-xl"></svg>
          </div>

          <div class="grid grid-cols-2 gap-3">
            <div class="rounded-xl border border-slate-200 bg-slate-50 p-3">
              <p class="text-[10px] uppercase tracking-wide text-slate-500">Last price</p>
              <p id="priceValue" class="mt-2 text-2xl font-bold text-slate-900">--</p>
            </div>
            <div class="rounded-xl border border-slate-200 bg-slate-50 p-3">
              <p class="text-[10px] uppercase tracking-wide text-slate-500">Stage</p>
              <p id="stageValue" class="mt-2 text-2xl font-bold text-slate-900">--</p>
            </div>
            <div class="rounded-xl border border-slate-200 bg-slate-50 p-3">
              <p class="text-[10px] uppercase tracking-wide text-slate-500">RS</p>
              <p id="rsValue" class="mt-2 text-2xl font-bold text-emerald-700">--</p>
            </div>
            <div class="rounded-xl border border-slate-200 bg-slate-50 p-3">
              <p class="text-[10px] uppercase tracking-wide text-slate-500">Base</p>
              <p id="baseValue" class="mt-2 text-2xl font-bold text-slate-900">--</p>
            </div>
            <div class="rounded-xl border border-slate-200 bg-slate-50 p-3">
              <p class="text-[10px] uppercase tracking-wide text-slate-500">Volume</p>
              <p id="volumeValue" class="mt-2 text-2xl font-bold text-slate-900">--</p>
            </div>
            <div class="rounded-xl border border-slate-200 bg-slate-50 p-3">
              <p class="text-[10px] uppercase tracking-wide text-slate-500">Sector</p>
              <p id="sectorValue" class="mt-2 text-lg font-bold text-slate-900">--</p>
            </div>
          </div>
        </div>
      </section>

      <section class="grid grid-cols-1 xl:grid-cols-2 gap-6">
        <div class="glass-card rounded-2xl border border-slate-200 shadow-sm p-5">
          <h3 class="text-xl font-bold text-slate-900">Setup summary</h3>
          <div id="setupSummary" class="mt-4 space-y-3 text-sm text-slate-700"></div>
        </div>

        <div class="glass-card rounded-2xl border border-slate-200 shadow-sm p-5">
          <h3 class="text-xl font-bold text-slate-900">Risk plan</h3>
          <div class="mt-4 space-y-3 text-sm text-slate-700">
            <div class="flex justify-between border-b border-slate-200 pb-2"><span>Entry</span><strong id="entryValue">--</strong></div>
            <div class="flex justify-between border-b border-slate-200 pb-2"><span>Stop</span><strong id="stopValue">--</strong></div>
            <div class="flex justify-between border-b border-slate-200 pb-2"><span>Target</span><strong id="targetValue">--</strong></div>
            <div class="flex justify-between border-b border-slate-200 pb-2"><span>Risk %</span><strong id="riskValue">--</strong></div>
            <div class="flex justify-between"><span>TF alignment</span><strong id="alignmentValue">--</strong></div>
          </div>
        </div>
      </section>
    </main>

    <script src="theme.js"></script>
    <script src="symbol_detail.js"></script>
  </body>
</html>
